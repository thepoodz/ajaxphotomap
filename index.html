<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajax Photo Map - Voyager Mode</title>

  <!-- MapLibre CSS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- Netlify Identity Widget for Decap CMS -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #e8ecef; }
    #map { width: 100%; height: 100vh; background-color: #e8ecef; }

    /* Custom Full-Screen Lightbox Modal Overlay */
    .photo-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      padding: 20px;
    }

    .photo-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .photo-modal-card {
      position: relative;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      max-width: 90vw;
      max-height: 88vh;
      width: 900px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }

    .photo-modal-overlay.active .photo-modal-card {
      transform: scale(1);
    }

    .photo-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      background: rgba(15, 23, 42, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    .photo-modal-close svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      display: block;
    }

    .photo-modal-close:hover {
      background: #ff4757;
      border-color: #ff4757;
      transform: scale(1.08);
    }

    .photo-modal-image-wrap {
      width: 100%;
      flex: 1;
      max-height: 68vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-modal-image-wrap img {
      max-width: 100%;
      max-height: 68vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .photo-modal-info {
      padding: 20px 24px;
      background: #ffffff;
    }

    .photo-modal-info h2 {
      color: #0f172a;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .photo-modal-info p {
      color: #475569;
      font-size: 15px;
      line-height: 1.4;
    }
    /* Container holding map + photo side-by-side */
.app-layout {
  display: flex;
  flex-direction: column-reverse; /* Stacks on mobile */
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* Desktop Split Screen */
@media (min-width: 768px) {
  .app-layout {
    flex-direction: row; /* Side-by-side on desktop */
  }
  
  /* Left Side: Map takes remaining width */
  #map { 
    flex: 1;
    height: 100% !important;
  }

  /* Right Side: Photo detail panel */
  #photo-panel {
    width: 400px; /* Fixed clean panel on right */
    height: 100%;
    background: #1a1a1a;
    color: #fff;
    padding: 20px;
    overflow-y: auto;
    border-left: 1px solid #333;
  }
}
  </style>
</head>
<body>
<div class="app-layout">
  <!-- Your existing map div -->
  <div id="map"></div>

  <!-- New side panel for photo display -->
  <div id="photo-panel">
    <div id="photo-content">
      <p style="color: #888; text-align: center; margin-top: 50%;">
        Select a pin on the map to view photo details.
      </p>
    </div>
  </div>
</div>

  <!-- Large Modal HTML Structure -->
  <div id="photo-modal" class="photo-modal-overlay">
    <div class="photo-modal-card" id="modal-card">
      <button class="photo-modal-close" id="modal-close-btn" title="Close (Esc)">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="photo-modal-image-wrap">
        <img id="modal-img" src="" alt="" />
      </div>
      <div class="photo-modal-info">
        <h2 id="modal-title"></h2>
        <p id="modal-caption"></p>
      </div>
    </div>
  </div>

  <!-- MapLibre JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    // Initialize map in Voyager mode with locked rotation
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
      center: [-79.0270, 43.8620],
      zoom: 11.5,
      bearing: -17,
      pitch: 0,
      dragRotate: false,
      pitchWithRotate: false,
      touchPitch: false,
      touchZoomRotate: true
    });

    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

    function buildInverseWorldMask(geometry) {
      let holes = [];
      if (geometry.type === 'Polygon') {
        holes = geometry.coordinates;
      } else if (geometry.type === 'MultiPolygon') {
        geometry.coordinates.forEach(polyCoords => holes.push(polyCoords[0]));
      }
      return {
        "type": "FeatureCollection",
        "features": [{
          "type": "Feature",
          "geometry": {
            "type": "Polygon",
            "coordinates": [[[-180, 90], [180, 90], [180, -90], [-180, -90], [-180, 90]], ...holes]
          }
        }]
      };
    }

    // Modal Lightbox Logic
    const modalOverlay = document.getElementById('photo-modal');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalCaption = document.getElementById('modal-caption');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    function openModal(photo) {
      modalImg.src = photo.imageUrl;
      modalImg.alt = photo.title;
      modalTitle.textContent = photo.title;
      modalCaption.textContent = photo.caption;
      modalOverlay.classList.add('active');
    }

    function closeModal() { modalOverlay.classList.remove('active'); }
    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    function renderPhotoMarker(photo) {
      const marker = new maplibregl.Marker({ color: '#ff4757' })
        .setLngLat([photo.lng, photo.lat])
        .addTo(map);

      marker.getElement().addEventListener('click', () => {
        openModal(photo);
      });
    }

    map.on('load', async () => {
      // 1. Reveal street labels earlier
      const styleLayers = map.getStyle().layers;
      styleLayers.forEach(layer => {
        if (layer.id.includes('road') || layer.id.includes('street') || layer.id.includes('label')) {
          if (layer.minzoom) {
            map.setLayerZoomRange(layer.id, Math.max(0, layer.minzoom - 3), layer.maxzoom || 24);
          }
        }
      });

      // 2. Fetch official Ajax boundary
      try {
        const response = await fetch('https://nominatim.openstreetmap.org/search?city=Ajax&state=Ontario&country=Canada&polygon_geojson=1&format=geojson');
        const data = await response.json();
        const ajaxFeature = data.features.find(f => f.properties.type === 'administrative' || f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon') || data.features[0];

        if (ajaxFeature) {
          const maskGeoJSON = buildInverseWorldMask(ajaxFeature.geometry);
          map.addSource('ajax-mask-source', { 'type': 'geojson', 'data': maskGeoJSON });
          map.addLayer({
            'id': 'ajax-dim-mask',
            'type': 'fill',
            'source': 'ajax-mask-source',
            'paint': { 'fill-color': '#1e293b', 'fill-opacity': 0.38 }
          });
          map.addLayer({
            'id': 'ajax-mask-outline',
            'type': 'line',
            'source': 'ajax-mask-source',
            'paint': { 'line-color': '#0284c7', 'line-width': 2, 'line-opacity': 0.85 }
          });
        }
      } catch (err) {
        console.error('Error fetching official boundary:', err);
      }

      // 3. Dynamic Fetch: Load photo points from external photos.json
      try {
        const photosResponse = await fetch('/photos.json');
        const data = await photosResponse.json();

        if (data && data.photos) {
          data.photos.forEach(renderPhotoMarker);
        }
      } catch (err) {
        console.error('Error loading photos.json:', err);
      }
    });
  </script>

  <!-- Netlify Identity Login Redirect Script -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
