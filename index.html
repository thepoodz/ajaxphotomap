<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Map</title>

  <!-- MapLibre GL JS CSS & JS -->
  <link href="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.js"></script>

  <!-- PapaParse for parsing Google Sheet CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* Popup Styling */
    .maplibregl-popup-content {
      padding: 12px;
      max-width: 260px;
      border-radius: 8px;
    }

    .popup-card h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #111;
    }

    .popup-card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
      margin-bottom: 8px;
    }

    .popup-card p {
      margin: 0;
      font-size: 13px;
      color: #444;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // ==========================================
    // 1. CONFIGURATION
    // ==========================================
    const SHEET_ID = '2PACX-1vRThlZrUgFmaOVTTgjPnDrUNuIGo0M23H98hoAGih-pmA-LvNzIdAmznNXA5k9teaeCUM-cZpalMu3d';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRThlZrUgFmaOVTTgjPnDrUNuIGo0M23H98hoAGih-pmA-LvNzIdAmznNXA5k9teaeCUM-cZpalMu3d/pub?output=csv`;

    // Initialize MapLibre with CARTO Voyager basemap
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
      center: [-79.0204, 43.8501], // Ajax, ON
      zoom: 12
    });

    map.addControl(new maplibregl.NavigationControl());

    // ==========================================
    // 2. LOAD DATA ON MAP LOAD
    // ==========================================
    map.on('load', () => {
      
      // Load Google Sheet Pins
      Papa.parse(SHEET_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const photos = results.data;

          photos.forEach(photo => {
            const lat = parseFloat(photo.lat);
            const lng = parseFloat(photo.lng);

            if (!isNaN(lat) && !isNaN(lng)) {
              const popupHtml = `
                <div class="popup-card">
                  ${photo.title ? `<h3>${photo.title}</h3>` : ''}
                  ${photo.image ? `<img src="${photo.image}" alt="${photo.title || 'Photo'}">` : ''}
                  ${photo.description ? `<p>${photo.description}</p>` : ''}
                </div>
              `;

              const popup = new maplibregl.Popup({ offset: 25 }).setHTML(popupHtml);

              new maplibregl.Marker({ color: '#e63946' })
                .setLngLat([lng, lat])
                .setPopup(popup)
                .addTo(map);
            }
          });
        }
      });
    });

    // ==========================================
    // 3. CLICK MAP TO COPY LAT/LNG
    // ==========================================
    map.on('click', (e) => {
      const lat = e.lngLat.lat.toFixed(6);
      const lng = e.lngLat.lng.toFixed(6);

      navigator.clipboard.writeText(`${lat}, ${lng}`).then(() => {
        console.log(`Copied coordinates: ${lat}, ${lng}`);
      });
    });
  </script>

</body>
</html>
